[project]
name = "agent-accelerator"
version = "2.2.0"
description = "Local-first evaluation, tracing and regression checks for agentic AI applications"
readme = "README.md"
authors = [
    { name = "Aditya Sreevatsa K", email = "aditya.sreevatsa+merck@msd.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2026.6.0,<2027",
    "inspect-ai>=0.3.278,<0.4",
    "jsonschema>=4.26.0,<5",
    "opentelemetry-sdk>=1.45.1,<2",
    "pydantic>=2.14.1,<3",
]

[project.optional-dependencies]
strands = [
    "strands-agents>=1.59.0,<2",
]
langgraph = [
    "langchain-core>=1.6.9,<2",
    "langgraph>=1.2.14,<2",
    "openinference-instrumentation-langchain>=0.1.79,<0.2",
]
bedrock-langgraph = [
    "langchain-aws>=1.7.9,<1.8",
]

[project.scripts]
aea = "agent_accelerator.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["slow: starts aea run subprocesses; scripts/ci.sh runs these"]
addopts = "-m 'not slow'"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
