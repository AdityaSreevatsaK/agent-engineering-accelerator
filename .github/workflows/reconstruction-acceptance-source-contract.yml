name: AEA acceptance and provenance source contract

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/audit_acceptance_source_contract.py
      - reconstruction_tools/test_acceptance_source_contract.py
      - docs/AEA_RECONSTRUCTION_ACCEPTANCE_SECURITY_REASSESSMENT_2026-11-09.md
      - .github/workflows/reconstruction-acceptance-source-contract.yml
      - src/agent_accelerator/run.py
      - src/agent_accelerator/cli.py
      - src/agent_accelerator/dataset.py
      - src/agent_accelerator/config.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-source-contract:
    name: Reconstructed acceptance contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify CLI, metadata, dataset hash and scrub contracts
        run: python -m reconstruction_tools.audit_acceptance_source_contract
      - name: Detect contract regression and provenance overclaim
        run: python -m unittest reconstruction_tools.test_acceptance_source_contract -v
      - name: Emit current machine-readable acceptance facts
        run: python -m reconstruction_tools.audit_acceptance_source_contract --format json

# Stdlib only, no agent/runtime imports, cloud calls or historic fixture reads.
# Passing source validation does not authenticate original video bytes or grant release signoff.
