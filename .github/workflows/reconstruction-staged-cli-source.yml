name: AEA staged original CLI source direct offline replay

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_cli.py
      - reconstruction_tools/run_staged_cli_source_replay.py
      - .github/workflows/reconstruction-staged-cli-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-cli-source:
    name: Original CLI selected tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline test dependencies
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Replay selected original CLI functions directly from staged source
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m reconstruction_tools.run_staged_cli_source_replay

