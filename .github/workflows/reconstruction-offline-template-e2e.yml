name: AEA reconstructed offline template end-to-end smoke

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/offline-template-e2e-2026-11-06

permissions:
  contents: read

jobs:
  offline-template-e2e:
    name: Offline starter E2E / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstruction review source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the real AEA package and offline Strands adapter
        run: python -m pip install -e ".[strands]"
      - name: Exercise real offline AEA CLI commands in a disposable directory
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python reconstruction_tools/verify_offline_template_e2e.py
      - name: Exercise video-recovered original calculator normal, broken and flaky agents
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python reconstruction_tools/verify_original_calculator_e2e.py

# Validates reconstructed CLI and video-recovered original calculator engine.
# Historical captured JSON fixtures and any live-provider integration remain unverified.
