name: TEMP regenerate safe uv lock on feature branch
on:
  push:
    branches:
      - security/full-lock-audit-and-licence-evidence

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/full-lock-audit-and-licence-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
      - name: Re-resolve lock to supported patch versions
        run: uv lock
      - name: Preserve lock result for independent inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-temporary-regenerated-lock
          path: uv.lock
          retention-days: 1
          if-no-files-found: error
      - name: Commit only updated uv.lock to review branch
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "chore: regenerate lock for Python 3.11.5+ without vulnerable 3.11.0 paths"
          git push origin HEAD:refs/heads/security/full-lock-audit-and-licence-evidence
