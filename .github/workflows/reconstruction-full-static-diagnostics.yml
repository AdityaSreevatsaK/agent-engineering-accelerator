name: AEA reconstruction full static diagnostics (non-gating)

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/full-static-diagnostics-2026-11-06

permissions:
  contents: read

jobs:
  full-static-diagnostics:
    name: Full Ruff and Pyright diagnostic baseline / Ubuntu / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout recovered source
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real AEA framework integrations and checkers
        run: >-
          python -m pip install -e ".[langgraph,strands]"
          "ruff>=0.17,<0.19"
          "pyright>=1.1.414,<1.2"
      - name: Collect full Ruff/Pyright JSON and summarised findings
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python reconstruction_tools/diagnose_full_static.py
      - name: Upload non-gating diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aea-reconstruction-full-static-diagnostics
          path: static-diagnostics/
          if-no-files-found: warn
          retention-days: 14

# Tool executions and report parsing are required to succeed. Existing
# style/type findings are NOT treated as zero; this is a diagnostic baseline.
# The production source and historical transcriptions are not rewritten.
