name: AEA original calculator LangGraph smoke

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - examples/calculator/langgraph_agent.py
      - examples/calculator/live_agent.py
      - .github/workflows/reconstruction-calculator-agents-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-graph:
    name: Calculator graph / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline framework dependencies
        run: python -m pip install -e ".[langgraph,strands]"
      - name: Parse both restored original Python examples
        run: python -c "import ast,pathlib; files=['examples/calculator/live_agent.py','examples/calculator/langgraph_agent.py']; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8'), filename=p) for p in files]"
      - name: Smoke-test local calculator graph and seeded broken graph
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: python -c "from examples.calculator.langgraph_agent import build_agent,build_broken_agent; from langchain_core.messages import HumanMessage; question={'messages':[HumanMessage(content='9 minus 4')]}; good=build_agent().invoke(question)['messages'][-1].content; bad=build_broken_agent().invoke(question)['messages'][-1].content; print('normal:',good,'broken:',bad); assert good=='5' and bad=='13'"

# Live Bedrock agent source is syntax-checked only: never call a paid model in CI.
