name: AEA reconstruction verification (review only)
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  comparison-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "inspect-ai>=0.3.278,<0.4" "jsonschema>=4.26.0,<5" "opentelemetry-sdk>=1.45.1,<2" "pydantic>=2.14.1,<3" "pytest>=9.1.1" "fsspec>=2026.6.0,<2027"
      - name: Compile reconstructed modules
        run: |
          python -m compileall -q src/agent_accelerator
      - name: Run original comparison tests without cloud credentials
        env:
          PYTHONPATH: src
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m pytest -q -m "not slow" tests/unit/test_compare.py tests/unit/test_compare_statistics.py
