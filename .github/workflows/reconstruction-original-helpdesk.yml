name: AEA restored helpdesk original video screenshot validation

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - examples/helpdesk/**
      - reconstruction_tools/verify_helpdesk_video_sources.py
      - reconstruction_tools/check_helpdesk_end_to_end.py
      - .github/workflows/reconstruction-original-helpdesk.yml
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helpdesk-replay:
    name: Helpdesk original evidence / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual AEA/Inspect AI/LangGraph dependencies
        run: python -m pip install -e ".[langgraph]" "pytest>=9.1.1,<10"
      - name: Audit video and screenshot transcripts without external model calls
        run: python -m reconstruction_tools.verify_helpdesk_video_sources
      - name: Test original screenshot cases against real AEA CLI and native LangGraph
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.check_helpdesk_end_to_end

# Supplementary check, not historical original test_helpdesk.py transcription.
# Two source videos and screenshot sources are fidelity-candidate evidence, not byte proof.
