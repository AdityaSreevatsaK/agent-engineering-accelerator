name: AEA four-video historical test fidelity verification

on:
  push:
    branches:
      - reconstruction/nov10-video-source-triage-fix
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30

permissions:
  contents: read

jobs:
  original-video-test-validation:
    name: Video-backed test suite / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local-native AI evaluation framework
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Confirm no unresolved source syntax defects and show historical count gaps
        run: |
          python -m compileall -q tests/unit/test_helpdesk.py tests/unit/test_policy_rag.py tests/unit/test_triage.py tests/unit/test_expense.py
          python reconstruction_tools/audit_original_example_test_counts.py
      - name: Execute integrated regression using disposable synthetic fixture
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m reconstruction_tools.run_integrated_offline_safe
