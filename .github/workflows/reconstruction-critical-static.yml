name: AEA reconstruction critical static checks

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/static-safety-2026-11-06

permissions:
  contents: read

jobs:
  critical-static-checks:
    name: Compile and high-risk lint / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstructed source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned-major Ruff checker
        run: python -m pip install "ruff>=0.17,<0.19"
      - name: Audit reconstructed full-video drafts and their recovered prefixes
        run: python reconstruction_tools/audit_drafts.py
      - name: Verify screenshot-recovered broken calculator log and original dataset hash
        run: python reconstruction_tools/verify_broken_redacted_screenshot.py
      - name: Compile active source, tests and reconstruction tools
        run: python -m compileall -q src/agent_accelerator tests/unit reconstruction_tools
      - name: Check severe syntax, unresolved names and invalid binding patterns
        run: ruff check src/agent_accelerator tests/unit reconstruction_tools --select E4,E7,E9,F63,F7,F82 --output-format concise

# This intentionally checks only high-risk static defects.
# Full E/F/I/UP/B style conformance and pyright typing remain unverified;
# do not rewrite original recovered source merely to satisfy formatting.
