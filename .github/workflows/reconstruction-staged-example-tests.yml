name: AEA staged original expense and triage tests

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_expense.py
      - tests/unit/test_triage.py
      - reconstruction_tools/run_staged_original_example_tests.py
      - .github/workflows/reconstruction-staged-example-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-tests:
    name: Original example tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline development dependencies
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Replay recorded original-path expense and triage tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m reconstruction_tools.run_staged_original_example_tests

# No paid provider calls and no original calculator fixtures are fabricated.
