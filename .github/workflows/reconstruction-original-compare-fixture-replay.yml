name: AEA historical comparison tests with generated offline logs

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/run_original_compare_with_generated_fixtures.py
      - reconstruction_tools/run_compare_without_original_fixtures.py
      - .github/workflows/reconstruction-original-compare-fixture-replay.yml
      - tests/unit/test_compare.py
      - tests/unit/test_compare_statistics.py
      - examples/calculator/**
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-comparison-replay:
    name: Recorded comparison replay / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout temporary reconstruction candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native offline Inspect AI and Strands dependencies
        run: python -m pip install -e ".[strands]" "pytest>=9.1.1,<10"
      - name: Check source-recorded calculator before generating disposable logs
        run: python reconstruction_tools/verify_calculator_video_sources.py
      - name: Replay recorded historical fixture-dependent comparison tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python reconstruction_tools/run_original_compare_with_generated_fixtures.py

# All arithmetic prompts are synthetic, generated by the screenshot-recovered
# offline calculator. The original historical JSON capture fixtures are still
# missing. No paid providers, credentials, external models, or original-file
# replacements are involved. Test data/staged source are deleted on completion.
