name: AEA original acceptance and security video evidence review

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/nov10-acceptance-review-video-fidelity-pass

permissions:
  contents: read

jobs:
  provisional-document-contract:
    name: Reviewed video document semantics / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify original-video semantic evidence (not original-byte identity)
        run: python -m reconstruction_tools.audit_provisional_document_evidence
      - name: Check negative drift cases
        run: python -m unittest reconstruction_tools.test_provisional_document_evidence -v
