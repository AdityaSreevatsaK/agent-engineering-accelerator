name: AEA original trace summary video test

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_trace_summary.py
      - src/agent_accelerator/trace_summary.py
      - reconstruction_tools/verify_trace_summary_original_video.py
      - .github/workflows/reconstruction-original-trace-summary.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-trace-summary:
    name: Original trace summary / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install AEA and pytest
        run: python -m pip install -e "." "pytest>=9.1.1,<10"
      - name: Audit all original source lines and function inventory
        run: python -m reconstruction_tools.verify_trace_summary_original_video
      - name: Execute the 13 original trace-summary unit tests
        run: python -m pytest -q tests/unit/test_trace_summary.py -m "not slow" --maxfail=1

# Preserves original video-derived test source, with exact recorded line
# and character counts. Does not certify lost source byte identity.
