name: AEA original Orders video and screenshot reconstruction

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - examples/orders/**
      - reconstruction_tools/verify_orders_original_sources.py
      - reconstruction_tools/check_orders_original_end_to_end.py
      - .github/workflows/reconstruction-original-orders.yml
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orders-native-strands:
    name: Original Orders / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual AEA with native Strands
        run: python -m pip install -e ".[strands]" "pytest>=9.1.1,<10"
      - name: Verify the complete original code recordings and screenshot dataset
        run: python -m reconstruction_tools.verify_orders_original_sources
      - name: Run original Orders cases through AEA CLI and test refund-policy regression
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.check_orders_original_end_to_end

# No AWS credentials, model invocations or paid calls. Original screenshot and
# code video dimensions match, but original source byte equality is not proven.
