name: AEA reconstruction full Ruff and Pyright quality gate

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/full-static-diagnostics-2026-11-06

permissions:
  contents: read

jobs:
  full-static-gate:
    name: Full Ruff and Pyright / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout recovered AEA source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install AEA framework dependencies and type/static checkers
        run: >-
          python -m pip install -e ".[langgraph,strands]"
          "ruff>=0.17,<0.19"
          "pyright>=1.1.414,<1.2"
      - name: Enforce project-configured full Ruff E/F/I/UP/B rules on production sources
        run: ruff check src/agent_accelerator --output-format concise
      - name: Enforce Pyright basic type verification on production sources
        run: pyright src --pythonversion ${{ matrix.python }}

# These are actual strict gates, NOT the previous non-gating diagnostic baseline.
# Tests, original video drafts, and scaffolding tools are outside pyproject's
# production-only type scope; do not claim a full repo style/type certification.
