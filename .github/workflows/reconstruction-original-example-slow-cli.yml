name: AEA original triage and expense full CLI mutation regression

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/replay_original_example_slow_cli.py
      - reconstruction_tools/verify_original_video_test_candidates.py
      - reconstruction_tools/verify_triage_expense_golden_screenshots.py
      - reconstruction_drafts/test_triage_FULL_VIDEO_CANDIDATE.py
      - reconstruction_drafts/test_expense_FULL_VIDEO_CANDIDATE.py
      - .github/workflows/reconstruction-original-example-slow-cli.yml
      - examples/triage/**
      - examples/expense/**
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-full-cli-regression:
    name: Original slow CLI / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real AEA, Inspect AI, LangGraph and pytest
        run: python -m pip install -e ".[langgraph]" "pytest>=9.1.1,<10"
      - name: Verify immutable video-source candidates and screenshot references
        run: |
          python -m reconstruction_tools.verify_original_video_test_candidates
          python -m reconstruction_tools.verify_triage_expense_golden_screenshots
      - name: Replay original triage good/reworded full-CLI evaluations
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.replay_original_example_slow_cli --suite triage
      - name: Replay original expense full/condensed full-CLI evaluations and scorer
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.replay_original_example_slow_cli --suite expense

# Both original candidate tests are staged byte-identically to their
# normalised reconstructed video texts. This validates behaviour, not
# historical original-file byte identity. Paid model calls are forbidden.
