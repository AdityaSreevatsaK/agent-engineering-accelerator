name: AEA original token accounting video reconstruction

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_tokens.py
      - src/agent_accelerator/compare.py
      - src/agent_accelerator/report.py
      - reconstruction_tools/verify_tokens_original_video.py
      - reconstruction_tools/replay_tokens_without_original_capture.py
      - .github/workflows/reconstruction-original-tokens.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-token-tests:
    name: Original tokens / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native AEA, Strands and original test dependencies
        run: python -m pip install -e ".[strands]" "pytest>=9.1.1,<10"
      - name: Verify full original source transcript and editor count
        run: python -m reconstruction_tools.verify_tokens_original_video
      - name: Replay 17 fixture-independent unit test functions
        run: python -m reconstruction_tools.replay_tokens_without_original_capture --group fast
      - name: Replay three offline original CLI price tests
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.replay_tokens_without_original_capture --group cli

# Seven original functions depend on an unrecoverable historical calculator
# JSON fixture. Excluded and NOT claimed as passed. Never fabricate that file.
