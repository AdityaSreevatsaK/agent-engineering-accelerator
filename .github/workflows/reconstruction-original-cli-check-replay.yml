name: AEA original CLI check/baseline replay (offline generated baseline)

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/run_original_cli_check_replay.py
      - reconstruction_drafts/test_cli_FULL_VIDEO_CANDIDATE.py
      - .github/workflows/reconstruction-original-cli-check-replay.yml
      - src/**
      - tests/conftest.py
      - examples/calculator/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cli-check:
    name: Original CLI check / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Checkout reconstruction branch candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original AEA runtime with native Strands for deterministic offline checks
        run: python -m pip install -e ".[strands]" "pytest>=9.1.1,<10"
      - name: Verify calculator original-video-derived source prerequisites
        run: python reconstruction_tools/verify_calculator_video_sources.py
      - name: Replay original check assertions using a disposable real offline baseline
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python reconstruction_tools/run_original_cli_check_replay.py --suite all

# Does NOT restore the missing historic baselines/calculator.json file.
# The new baseline is clearly labelled generated, lives under TemporaryDirectory,
# and is only consumed by a temporary source-replay copy with unchanged assertions.
# No cloud calls, paid model usage, or historical JSON fixture substitutions.
