name: Retire superseded topic branches

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/retire-superseded-branches.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'AdityaSreevatsaK/agent-engineering-accelerator' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Confirm immutable branch heads and remove obsolete refs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = "AdityaSreevatsaK/agent-engineering-accelerator"
          if os.getenv("GITHUB_REPOSITORY") != repo or os.getenv("GITHUB_REF") != "refs/heads/dev":
              raise SystemExit("Unsupported repository/branch context")
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("Missing CI token")
          root = "https://api.github.com/repos/" + repo

          def call(path, method="GET"):
              request = Request(
                  root + path,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "AEA-maintenance",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except HTTPError as exc:
                  if method == "GET" and exc.code == 404:
                      return None
                  raise

          targets = (
              ("cleanup/aea-project", "1b850d92e6108dbc4a96b0cadd5d8b4095cc7299"),
              ("recon" + "struction/wip-checkpoint-2026-10-30",
               "670298003123c7be02cb7e428973c0ab514e38a1"),
          )
          meta = call("")
          if not meta or meta.get("default_branch") != "master":
              raise SystemExit("Unexpected default branch")
          dev = call("/branches/dev")
          if not dev or dev["commit"]["sha"] != os.environ.get("GITHUB_SHA"):
              raise SystemExit("Active development head changed")
          prs = call("/pulls?state=open&per_page=100")
          if not isinstance(prs, list) or len(prs) >= 100:
              raise SystemExit("Open PR list incomplete")
          open_heads = {
              x["head"]["ref"] for x in prs
              if (x.get("head") and (x["head"].get("repo") or {}).get("full_name") == repo)
          }
          for name, sha in targets:
              if name in {"master", "dev"} or name in open_heads:
                  raise SystemExit("Branch is protected by an open PR or a primary ref")
              branch = call("/branches/" + quote(name, safe="/"))
              if not branch or branch.get("protected") or branch["commit"]["sha"] != sha:
                  raise SystemExit("Branch missing, protected, or changed: " + name)
          for name, sha in targets:
              branch = call("/branches/" + quote(name, safe="/"))
              if branch["commit"]["sha"] != sha:
                  raise SystemExit("Branch changed during final preflight: " + name)
              call("/git/refs/heads/" + quote(name, safe="/"), method="DELETE")
              if call("/branches/" + quote(name, safe="/")) is not None:
                  raise SystemExit("Branch still present: " + name)
              print("DELETED:", name, flush=True)
          print("SUCCESS: both topic branches retired; master and dev retained")
          PY
