name: AEA reconstructed judge and report verification

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/verify-judge-report-2026-11-05

permissions:
  contents: read

jobs:
  native-judge-tests:
    name: Judge/report tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstruction candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared AEA runtime and test dependencies
        run: >-
          python -m pip install
          "inspect-ai>=0.3.278,<0.4"
          "fsspec>=2026.6.0,<2027"
          "jsonschema>=4.26.0,<5"
          "opentelemetry-sdk>=1.45.1,<2"
          "pydantic>=2.14.1,<3"
          "pytest>=9.1.1,<10"
      - name: Install AEA package metadata for run provenance
        run: python -m pip install --no-deps -e .
      - name: Run recovered judge and pairwise-report suites offline
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: >-
          python -m pytest -q -m "not slow"
          # The following source example configs have not been recovered; they cannot be tested honestly.
          --deselect='tests/unit/test_config.py::test_example_config_loads_and_every_reference_it_names_resolves_to_a_callable[triage]'
          --deselect='tests/unit/test_config.py::test_example_config_loads_and_every_reference_it_names_resolves_to_a_callable[expense]'
          tests/unit/test_judge_double.py
          tests/unit/test_judge_double_pairwise.py
          tests/unit/test_report_pairwise.py
          tests/unit/test_judge_interrupt.py
          tests/unit/test_readings_pairwise.py
          tests/unit/test_cli_pairwise.py
          tests/unit/test_export.py
          tests/unit/test_readings.py
          tests/unit/test_report.py
          tests/unit/test_judge.py
          tests/unit/test_config.py
          tests/unit/test_dataset.py
          tests/unit/test_scorers.py
          tests/unit/test_tool_metrics.py

# No AWS login, credentials, paid model API calls or deployment.
# These tests exercise recovered AEA source and deterministic judge_double only.
