name: AEA CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and quick smoke / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
      - name: Verify committed dependency lock
        run: uv lock --check
      - name: Install project and dev dependencies
        run: uv sync --all-extras --group dev --locked
      - name: Static checks
        run: |
          uv run --locked ruff check src examples
          uv run --locked pyright
      - name: Produce platform-specific dependency and licence review BOM
        run: uv run --locked python scripts/dependency_licence_sbom.py --output-dir "${{ runner.temp }}/aea-licence-evidence"
      - name: Retain review-only dependency BOM and licence metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-licences-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/aea-licence-evidence/SBOM.cdx.json
            ${{ runner.temp }}/aea-licence-evidence/licence-evidence.json
            ${{ runner.temp }}/aea-licence-evidence/LICENCE_REVIEW.md
          retention-days: 14
          if-no-files-found: error
      - name: Audit the actual Python and OS runtime dependency selection
        run: uv run --locked python scripts/audit_public_advisories.py --output-dir "${{ runner.temp }}/aea-platform-advisories"
      - name: Reconcile advisory results with installed and locked variants
        run: |
          uv run --locked python scripts/assess_advisory_coverage.py --sbom-evidence "${{ runner.temp }}/aea-licence-evidence/licence-evidence.json" --advisory-evidence "${{ runner.temp }}/aea-platform-advisories/advisory-results.json" --output-dir "${{ runner.temp }}/aea-platform-coverage"
      - name: Retain platform advisory scan and coverage summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-platform-advisory-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/aea-platform-advisories/advisory-results.json
            ${{ runner.temp }}/aea-platform-advisories/ADVISORY_REVIEW.md
            ${{ runner.temp }}/aea-platform-coverage/coverage.json
            ${{ runner.temp }}/aea-platform-coverage/COVERAGE_REVIEW.md
          retention-days: 14
          if-no-files-found: error
      - name: Source-tree hygiene
        run: uv run --locked python scripts/check_repository_hygiene.py
      - name: Offline unit tests
        run: uv run --locked python scripts/run_checks.py
      - name: LangGraph conformance cases
        run: uv run --locked python -m pytest -q -m "not slow" tests/conformance
      - name: Real CLI smoke with local models
        run: uv run --locked python scripts/check_examples.py --quick

  examples:
    name: Complete offline example suite
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --all-extras --group dev --locked
      - run: uv run --locked python scripts/check_examples.py

  release_checks:
    name: Offline regression and installed-wheel smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --all-extras --group dev --locked
      - name: Assert the CLI detects a deliberately degraded agent
        run: uv run --locked python scripts/verify_regression_gate.py
      - name: Privacy redaction CLI contract
        run: uv run --locked python scripts/check_privacy_e2e.py
      - name: Complete CLI subprocess and marked-slow conformance tests
        run: uv run --locked python scripts/run_checks.py --slow
      - name: Execute leadership demonstration end to end
        run: uv run --locked python scripts/leadership_demo.py --output-dir "${{ runner.temp }}/aea-leadership-demo"
      - name: Rehearse local Strands and LangGraph baseline regression
        run: uv run --locked python scripts/pilot_rehearsal.py --output-dir "${{ runner.temp }}/aea-pilot-rehearsal" --repeats 1
      - name: Validate separate application integrations from their own directories
        run: uv run --locked python scripts/validate_independent_integrations.py --repeats 1
      - name: Prove one-command Strands quickstart
        run: uv run --locked python scripts/validate_independent_integrations.py --only equipment-strands --repeats 1 --output-dir "${{ runner.temp }}/aea-strands-quickstart"
      - name: Prove one-command LangGraph quickstart
        run: uv run --locked python scripts/validate_independent_integrations.py --only vendor-langgraph --repeats 1 --output-dir "${{ runner.temp }}/aea-langgraph-quickstart"
      - name: Benchmark public CLI runtime on standalone synthetic applications
        run: uv run --locked python -m scripts.benchmark_agent_evaluations --repeats 2 --output-dir "${{ runner.temp }}/aea-benchmark"
      - name: Retain synthetic-only benchmarking summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-synthetic-benchmark
          path: |
            ${{ runner.temp }}/aea-benchmark/evidence.json
            ${{ runner.temp }}/aea-benchmark/BENCHMARK.md
          retention-days: 14
          if-no-files-found: error
      - name: Compare direct conventional QA against AEA on the same synthetic cases
        run: uv run --locked python -m scripts.controlled_pilot_study --repeats 1 --output-dir "${{ runner.temp }}/aea-controlled-pilot"
      - name: Retain synthetic conventional-control parity summaries only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-controlled-pilot-summary
          path: |
            ${{ runner.temp }}/aea-controlled-pilot/evidence.json
            ${{ runner.temp }}/aea-controlled-pilot/STUDY.md
          retention-days: 14
          if-no-files-found: error
      - name: Validate committed dependency sources and hashes
        run: uv run --locked python scripts/dependency_inventory.py --output-dir "${{ runner.temp }}/aea-dependency-inventory"
      - name: Retain security inventory summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-lock-inventory
          path: |
            ${{ runner.temp }}/aea-dependency-inventory/inventory.json
            ${{ runner.temp }}/aea-dependency-inventory/INVENTORY.md
          retention-days: 14
          if-no-files-found: error
      - name: Scan locked runtime dependencies for public advisories
        run: uv run --locked python scripts/audit_public_advisories.py --output-dir "${{ runner.temp }}/aea-public-advisories"
      - name: Retain advisory findings for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-public-advisory-scan
          path: |
            ${{ runner.temp }}/aea-public-advisories/advisory-results.json
            ${{ runner.temp }}/aea-public-advisories/ADVISORY_REVIEW.md
          retention-days: 14
          if-no-files-found: error
      - name: Audit all locked package versions including dev-only and OS alternatives
        run: uv run --locked python scripts/audit_all_locked_variants.py --output-dir "${{ runner.temp }}/aea-full-lock-advisories" --fail-on-findings
      - name: Retain complete locked variant advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-complete-lock-advisories
          path: |
            ${{ runner.temp }}/aea-full-lock-advisories/full-lock-advisories.json
            ${{ runner.temp }}/aea-full-lock-advisories/FULL_LOCK_ADVISORY_REVIEW.md
          retention-days: 14
          if-no-files-found: error
      - name: Prove generated starter supports doctor baseline comparison and HTML offline
        run: uv run --locked python scripts/verify_starter_walkthrough.py
      - name: Validate published uv-run console CLI in both standalone app directories
        run: uv run --locked python scripts/verify_runbook_console.py
      - name: Build a distributable wheel
        run: uv build --wheel
      - name: Verify the installed package in a fresh environment
        run: uv run --locked python scripts/check_distribution.py

  onboarding_rehearsal:
    name: Fresh-environment scripted onboarding measurement
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
      - name: Time dependency sync and complete synthetic onboarding
        run: python -m scripts.onboarding_rehearsal --output-dir "${{ runner.temp }}/aea-onboarding-rehearsal"
      - name: Retain synthetic onboarding timings only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aea-scripted-onboarding-timings
          path: |
            ${{ runner.temp }}/aea-onboarding-rehearsal/evidence.json
            ${{ runner.temp }}/aea-onboarding-rehearsal/ONBOARDING_REHEARSAL.md
          retention-days: 14
          if-no-files-found: error
