name: AEA CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and quick smoke / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Verify committed dependency lock
        run: uv lock --check
      - name: Install project and dev dependencies
        run: uv sync --all-extras --group dev --locked
      - name: Static checks
        run: |
          uv run --locked ruff check src examples
          uv run --locked pyright
      - name: Source-tree hygiene
        run: uv run --locked python scripts/check_repository_hygiene.py
      - name: Offline unit tests
        run: uv run --locked python scripts/run_checks.py
      - name: LangGraph conformance cases
        run: uv run --locked python -m pytest -q -m "not slow" tests/conformance
      - name: Real CLI smoke with local models
        run: uv run --locked python scripts/check_examples.py --quick

  examples:
    name: Complete offline example suite
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --all-extras --group dev --locked
      - run: uv run --locked python scripts/check_examples.py

  release_checks:
    name: Offline regression and installed-wheel smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      OPENAI_API_KEY: ''
      AZURE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --all-extras --group dev --locked
      - name: Assert the CLI detects a deliberately degraded agent
        run: uv run --locked python scripts/verify_regression_gate.py
      - name: Privacy redaction CLI contract
        run: uv run --locked python scripts/check_privacy_e2e.py
      - name: Complete CLI subprocess and marked-slow conformance tests
        run: uv run --locked python scripts/run_checks.py --slow
      - name: Execute leadership demonstration end to end
        run: uv run --locked python scripts/leadership_demo.py --output-dir "${{ runner.temp }}/aea-leadership-demo"
      - name: Rehearse local Strands and LangGraph baseline regression
        run: uv run --locked python scripts/pilot_rehearsal.py --output-dir "${{ runner.temp }}/aea-pilot-rehearsal" --repeats 1
      - name: Validate separate application integrations from their own directories
        run: uv run --locked python scripts/validate_independent_integrations.py --repeats 1
      - name: Benchmark public CLI runtime on standalone synthetic applications
        run: uv run --locked python -m scripts.benchmark_agent_evaluations --repeats 2 --output-dir "${{ runner.temp }}/aea-benchmark"
      - name: Retain synthetic-only benchmarking summaries
        uses: actions/upload-artifact@v4
        with:
          name: aea-synthetic-benchmark
          path: |
            ${{ runner.temp }}/aea-benchmark/evidence.json
            ${{ runner.temp }}/aea-benchmark/BENCHMARK.md
          retention-days: 14
          if-no-files-found: error
      - name: Validate committed dependency sources and hashes
        run: uv run --locked python scripts/dependency_inventory.py --output-dir "${{ runner.temp }}/aea-dependency-inventory"
      - name: Retain security inventory summary
        uses: actions/upload-artifact@v4
        with:
          name: aea-lock-inventory
          path: |
            ${{ runner.temp }}/aea-dependency-inventory/inventory.json
            ${{ runner.temp }}/aea-dependency-inventory/INVENTORY.md
          retention-days: 14
          if-no-files-found: error
      - name: Scan locked runtime dependencies for public advisories
        run: uv run --locked python scripts/audit_public_advisories.py --output-dir "${{ runner.temp }}/aea-public-advisories"
      - name: Retain advisory findings for review
        uses: actions/upload-artifact@v4
        with:
          name: aea-public-advisory-scan
          path: |
            ${{ runner.temp }}/aea-public-advisories/advisory-results.json
            ${{ runner.temp }}/aea-public-advisories/ADVISORY_REVIEW.md
          retention-days: 14
          if-no-files-found: error
      - name: Build a distributable wheel
        run: uv build --wheel
      - name: Verify the installed package in a fresh environment
        run: uv run --locked python scripts/check_distribution.py
