name: AEA LangGraph reconstructed privacy and interrupt E2E

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/verify_langgraph_capture_privacy_e2e.py
      - .github/workflows/reconstruction-langgraph-privacy-e2e.yml
      - examples/triage/**
      - examples/helpdesk/**
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-langgraph-capture:
    name: LangGraph privacy / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install AEA and native LangGraph adapter
        run: python -m pip install -e ".[langgraph]"
      - name: "Verify triage custom state mapping: scrubbed vs explicit capture"
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_langgraph_capture_privacy_e2e --scenario triage
      - name: "Verify helpdesk approval interrupt: scrubbed vs explicit capture"
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_langgraph_capture_privacy_e2e --scenario helpdesk_interrupt

# Synthetic marker, temporary output and deliberate opt-in capture only.
# No paid providers, historical baselines or fixture replacements.
