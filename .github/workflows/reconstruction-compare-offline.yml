name: AEA comparison tests without missing historical fixtures

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/verify-compare-no-fixtures-2026-11-05

permissions:
  contents: read

jobs:
  comparison-no-historical-fixtures:
    name: Comparison / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstruction review code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local AEA and test dependencies
        run: >-
          python -m pip install -e .
          "pytest>=9.1.1,<10"
      - name: Run source-verified fixture-independent comparison tests
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python reconstruction_tools/run_compare_without_original_fixtures.py

# Omits only explicitly listed fixture-bound tests. No original JSON fixture
# is fabricated or committed; any new source fixture usage fails preflight.
# Does not call external model providers.
