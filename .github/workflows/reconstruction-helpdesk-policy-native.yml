name: AEA original helpdesk and policy RAG native tests

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_helpdesk.py
      - tests/unit/test_policy_rag.py
      - .github/workflows/reconstruction-helpdesk-policy-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-original-tests:
    name: Original helpdesk+policy / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native frameworks without provider credentials
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Run recovered original tests offline
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: python -m pytest -q -m "not slow" tests/unit/test_helpdesk.py tests/unit/test_policy_rag.py
      - name: Run recorded offline end-to-end example tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: python -m pytest -q -m slow tests/unit/test_helpdesk.py tests/unit/test_policy_rag.py

# These two provisional reconstructions use offline graph doubles.
# This workflow cannot prove byte-for-byte original text fidelity.
