name: AEA original triage and expense JSONL reconstruction verification

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - examples/triage/dataset.jsonl
      - examples/expense/dataset.jsonl
      - reconstruction_tools/verify_triage_expense_datasets_video.py
      - reconstruction_tools/verify_triage_expense_datasets_e2e.py
      - .github/workflows/reconstruction-triage-expense-datasets.yml
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-dataset-replay:
    name: Recovered JSONL offline AEA / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstruction candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual AEA and native LangGraph framework dependencies
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Validate 24 JSONL source cases, source hashes and original editor measurements
        run: python -m reconstruction_tools.verify_triage_expense_datasets_video
      - name: Execute actual recovered LangGraph agents over both original datasets
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_triage_expense_datasets_e2e

# Source line/character counts are corroborating, not byte-for-byte proof.
# No original Inspect JSON fixture is restored/generated. Temporary AEA logs are
# created and destroyed only within the runner. No cloud or paid provider calls.
