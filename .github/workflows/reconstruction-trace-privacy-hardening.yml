name: AEA redacted trace-exporter privacy hardening

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - src/agent_accelerator/tracing.py
      - tests/unit/test_tracing.py
      - reconstruction_tools/test_trace_export_privacy_hardening.py
      - .github/workflows/reconstruction-trace-privacy-hardening.yml

permissions:
  contents: read

jobs:
  privacy:
    name: Trace exporter privacy / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reconstructed tracing dependencies and pytest
        run: python -m pip install -e ".[strands]" "pytest>=9.1.1,<10"
      - name: Run historical tracing tests plus new synthetic privacy probes
        run: python -m pytest -q tests/unit/test_tracing.py reconstruction_tools/test_trace_export_privacy_hardening.py
