name: AEA historical CI activation preflight

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/reconstruction-historical-ci-preflight.yml
      - reconstruction_tools/preflight_historical_ci.py
      - reconstruction_tools/test_historical_ci_preflight.py
      - reconstruction_drafts/original_github_workflows_ci.yml.txt
      - reconstruction_manifest/original_paths.txt
      - uv.lock
      - baselines/**
      - tests/fixtures/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-original-ci:
    name: CI activation safety / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check preflight behaviour
        run: python -m unittest reconstruction_tools.test_historical_ci_preflight -v
      - name: Fail closed if recorded CI is prematurely active
        run: python -m reconstruction_tools.preflight_historical_ci

# Historical recordings and baselines are not generated or rewritten.
# This is separate from the archived original CI and does not require paid APIs.
