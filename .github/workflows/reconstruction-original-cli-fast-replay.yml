name: AEA original-video CLI fast source replay

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_drafts/test_cli_FULL_VIDEO_CANDIDATE.py
      - reconstruction_tools/run_original_cli_fast_replay.py
      - .github/workflows/reconstruction-original-cli-fast-replay.yml
      - src/**
      - examples/triage/**
      - examples/expense/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cli-fast:
    name: Original CLI replay / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Checkout candidate reconstruction code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real AEA dependencies without any provider credentials
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Check active pairwise test provenance against the video draft
        run: python reconstruction_tools/verify_pairwise_active_fidelity.py
      - name: Replay captured historical CLI test functions using actual AEA code
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: python reconstruction_tools/run_original_cli_fast_replay.py

# Does not commit a historical test file or substitute original JSON fixtures.
# Selected original tests mock run launch, so there are no paid model calls.
