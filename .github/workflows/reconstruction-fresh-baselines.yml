name: AEA fresh reconstructed baseline bundle

on:
  push:
    branches:
      - reconstruction/nov11-fresh-baselines
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30

permissions:
  contents: read

jobs:
  produce-safe-new-baselines:
    name: Generate seven scrubbed offline evaluation baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reconstructed offline agent framework dependencies
        run: python -m pip install -e ".[langgraph,strands]"
      - name: Verify non-destructive baseline generation contract
        run: python -m unittest reconstruction_tools.test_generate_fresh_baselines -v
      - name: Preflight generation without writing logs
        run: python -m reconstruction_tools.generate_fresh_baselines --dry-run
      - name: Generate fresh scrubbed baseline logs
        run: python -m reconstruction_tools.generate_fresh_baselines
      - name: Check manifest provenance and all seven outputs
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from agent_accelerator.compare import load_results
          root = Path("baselines-new")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["provenance"] == "reconstructed-offline-run; NOT a historical baseline"
          assert manifest["capture_content"] is False
          assert len(manifest["baselines"]) == 7
          for entry in manifest["baselines"]:
              run = root / entry["name"]
              log = run / entry["inspect_log_file"]
              assert log.is_file()
              assert (run / "report.md").is_file()
              assert (run / "traces.jsonl").is_file()
              assert hashlib.sha256(log.read_bytes()).hexdigest() == entry["inspect_log_sha256"]
              results = load_results(run)
              assert results.status == "success", entry["name"]
              assert len(results.cases) == entry["case_count"], entry["name"]
              assert all(case.passed for case in results.cases.values()), entry["name"]
              print(f"VERIFIED NEW {entry['name']}: {len(results.cases)} passing cases")
      - name: Upload generated baseline bundle for review, not original recovery
        uses: actions/upload-artifact@v4
        with:
          name: aea-baselines-new-offline-scrubbed
          path: baselines-new/
          if-no-files-found: error
          retention-days: 14
