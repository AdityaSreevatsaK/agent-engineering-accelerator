name: AEA original tracing exporter test video

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/unit/test_tracing.py
      - src/agent_accelerator/tracing.py
      - reconstruction_tools/verify_tracing_original_video.py
      - .github/workflows/reconstruction-original-tracing.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-tracing:
    name: Original tracing / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual AEA and pytest
        run: python -m pip install -e "." "pytest>=9.1.1,<10"
      - name: Pin exact original video source dimensions and five test names
        run: python -m reconstruction_tools.verify_tracing_original_video
      - name: Replay all original OpenTelemetry JSONL exporter tests
        run: python -m pytest -q tests/unit/test_tracing.py -m "not slow" --maxfail=1

# No cloud credentials or paid LLM calls. Editor character fidelity
# does not certify historical original source byte equality.
