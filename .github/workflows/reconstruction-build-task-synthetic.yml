name: AEA calculator build-task contract verification

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/verify-build-task-synthetic-2026-11-05

permissions:
  contents: read

jobs:
  build-task-contract:
    name: Build task / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout reconstruction candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install AEA runtime dependencies and pytest
        run: >-
          python -m pip install
          "inspect-ai>=0.3.278,<0.4"
          "agent-client-protocol>=0.12,<1.0"
          "fsspec>=2026.6.0,<2027"
          "jsonschema>=4.26.0,<5"
          "opentelemetry-sdk>=1.45.1,<2"
          "pydantic>=2.14.1,<3"
          "pytest>=9.1.1,<10"
          "strands-agents>=1.59.0,<2"
      - name: Install AEA distribution metadata
        run: python -m pip install --no-deps -e .
      - name: Verify source-recorded calculator agent and ten-case dataset
        run: python reconstruction_tools/verify_calculator_video_sources.py
      - name: Generate temporary synthetic Inspect capture fixture
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: python reconstruction_tools/make_synthetic_capture.py
      - name: Run recovered build, run and scrub tests against real AEA source
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_EC2_METADATA_DISABLED: "true"
        run: >-
          python -m pytest -q -m "not slow"
          tests/unit/test_build_task.py
          tests/unit/test_run_task.py
          tests/unit/test_scrub.py

# The original calculator agent, dataset and shared rules are restored from supplied footage.
# The captured Inspect log is still a CI-only synthetic stand-in until the
# original historical fixture files are recovered.
# No model calls, cloud credentials or repository upload of generated fixtures.
