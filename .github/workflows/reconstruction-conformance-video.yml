name: AEA original conformance video reconstruction

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - tests/conformance/**
      - reconstruction_tools/verify_conformance_video_sources.py
      - .github/workflows/reconstruction-conformance-video.yml
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-conformance:
    name: Original conformance / OS and Python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reconstructed AEA and native LangGraph and Inspect AI
        run: python -m pip install -e ".[langgraph]" "pytest>=9.1.1,<10"
      - name: Verify historical video source counts and syntax
        run: python -m reconstruction_tools.verify_conformance_video_sources
      - name: Replay original conformance unit cases with real integrations
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m pytest -q tests/conformance/test_conformance.py -m "not slow" --maxfail=1
      - name: Run original offline CLI conformance as isolated process
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m pytest -q tests/conformance/test_conformance.py -m slow --maxfail=1

# Tests are from complete source videos, no cloud/paid LLM calls.
# Video/editor dimension match is NOT original-byte proof.
