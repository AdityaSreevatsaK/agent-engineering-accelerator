name: AEA triage and expense native offline LangGraph verification

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - examples/triage/**
      - examples/expense/**
      - reconstruction_tools/verify_triage_expense_agents_offline.py
      - reconstruction_tools/verify_triage_expense_rules_video.py
      - .github/workflows/reconstruction-triage-expense-native.yml
      - pyproject.toml
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-langgraph-example:
    name: Video-recovered LangGraph examples / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Checkout provisional original-source candidate
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native LangGraph and Inspect dependencies (no paid models)
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Validate video source counts and deterministic rules independently
        run: python reconstruction_tools/verify_triage_expense_rules_video.py
      - name: Verify original two config test cases without deferrals
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m pytest -q -m "not slow" tests/unit/test_config.py -k "example_config_loads"
      - name: Run real offline LangGraph examples with their recorded model doubles
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_triage_expense_agents_offline

# No original triage/expense dataset files yet: smoke test inputs are
# explicitly newly generated, NOT historical data. Never invoke build_live_agent
# (real AWS Bedrock provider). No credential, cloud or paid model access.
