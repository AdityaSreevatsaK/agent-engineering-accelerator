name: One-time dependency lock generation

on:
  push:
    branches:
      - improvement/reproducible-dependencies
    paths:
      - .github/workflows/create-dependency-lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'AdityaSreevatsaK/agent-engineering-accelerator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improvement/reproducible-dependencies
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Resolve exact multi-platform dependencies
        run: uv lock
      - name: Commit new lockfile to this isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          test -s uv.lock
          uv lock --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- uv.lock
          if git diff --cached --quiet; then
            echo "Dependency lock already committed"
            exit 0
          fi
          git commit -m 'Pin resolved Python dependencies with uv.lock'
          git push origin HEAD:refs/heads/improvement/reproducible-dependencies
