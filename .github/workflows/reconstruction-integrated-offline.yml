name: AEA integrated offline reconstruction regression

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
  push:
    branches:
      - reconstruction/integrated-offline-suite-2026-11-05

permissions:
  contents: read

jobs:
  integrated-offline:
    name: All recovered unit suites / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual AEA and native agent framework dependencies
        run: python -m pip install -e ".[langgraph,strands]" "pytest>=9.1.1,<10"
      - name: Verify source-recorded calculator agent and dataset; never overwrite originals
        run: python reconstruction_tools/verify_calculator_video_sources.py
      - name: Provide temporary non-executable CI rules import shim (not original source)
        run: python reconstruction_tools/make_ci_rules_stub.py
      - name: Generate temporary CI-only SYNTHETIC Inspect log
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python reconstruction_tools/make_synthetic_capture.py
      - name: Execute integrated original-path unit suite with audited exclusions
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m reconstruction_tools.run_integrated_offline

# Original calculator agent and dataset have been restored from video/screenshot.
      - name: Recover seven original comparison cases misclassified by subprocess fixture marker
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python reconstruction_tools/verify_slow_parameter_collision.py

# Historical JSON logs, calculator rules, and triage/expense configs remain missing.
# The missing rules are substituted with a non-executable CI-only IMPORT shim.
# Generated synthetic captured logs are CI-only and NEVER original recovered files.
# Runner checks the transitive fixture-exclusion manifest before pytest.
# All existing active unit suites are invoked together, without external models.
