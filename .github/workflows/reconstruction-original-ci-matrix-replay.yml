name: AEA seven original CI example lanes with disposable baselines

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/replay_original_ci_example_matrix.py
      - reconstruction_tools/test_original_ci_example_matrix.py
      - .github/workflows/reconstruction-original-ci-matrix-replay.yml
      - scripts/ci.sh
      - examples/**
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorded-script-example-replay:
    name: Seven original CI examples / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install recovered AEA and native offline adapters
        run: python -m pip install -e ".[strands,langgraph]"
      - name: Verify exact historical scripts/ci.sh seven-lane manifest
        run: python -m unittest reconstruction_tools.test_original_ci_example_matrix -v
      - name: Run all seven reconstructed example baselines and mutants
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: python -m reconstruction_tools.replay_original_ci_example_matrix --scenario all

# This is a replacement *example-stage* validation only: historical uv.lock,
# original CI workflow, and fourteen historical baselines remain unavailable.
# Never write any generated log or trace to historical baselines/ or fixtures/.
