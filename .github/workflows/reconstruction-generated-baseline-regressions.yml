name: AEA disposable recovered-example baseline regressions

on:
  pull_request:
    branches:
      - reconstruction/wip-checkpoint-2026-10-30
    paths:
      - reconstruction_tools/verify_recovered_example_baselines.py
      - .github/workflows/reconstruction-generated-baseline-regressions.yml
      - examples/calculator/**
      - examples/triage/**
      - examples/expense/**
      - src/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-functional:
    name: Generated-only baseline check / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native AEA adapters for local model doubles
        run: python -m pip install -e ".[strands,langgraph]"
      - name: Check historical calculator with disposable baseline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_recovered_example_baselines --scenario calculator
      - name: Check historical triage with disposable baseline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_recovered_example_baselines --scenario triage
      - name: Check historical expense with disposable baseline and grounding scorer
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m reconstruction_tools.verify_recovered_example_baselines --scenario expense

# This job never reconstructs, modifies or commits baselines/**.
# Temporary runtime output is removed on success and on Python exceptions.
# Historical baseline source bytes and provenance remain unavailable.
